# ══════════════════════════════════════════════════════════════════════════════
#                         VALERTER CONFIGURATION
# ══════════════════════════════════════════════════════════════════════════════
#
# Copy this file to /etc/valerter/config.yaml and customize.
#
# Required sections: victorialogs, defaults, templates, notifiers, rules
# Optional section:  metrics
#
# ──────────────────────────────────────────────────────────────────────────────
# SECRETS MANAGEMENT
# ──────────────────────────────────────────────────────────────────────────────
#
# Option 1 - Direct values (simple deployments):
#   Secure with: chmod 600 /etc/valerter/config.yaml
#   webhook_url: "https://mattermost.example.com/hooks/abc123"
#
# Option 2 - Environment variables (Kubernetes, orchestrators):
#   Variables resolved at startup from process environment.
#   webhook_url: "${MM_WEBHOOK}"
#
# Both approaches can be mixed in the same file.
#
# ──────────────────────────────────────────────────────────────────────────────
# MULTI-FILE CONFIGURATION
# ──────────────────────────────────────────────────────────────────────────────
#
# Split configuration into .d/ directories for large deployments:
#
#   /etc/valerter/
#   ├── config.yaml
#   ├── rules.d/
#   │   ├── security.yaml
#   │   └── infra.yaml
#   ├── templates.d/
#   │   └── custom.yaml
#   └── notifiers.d/
#       └── team-channels.yaml
#
# In .d/ files, the resource name is the YAML key (not a field):
#
#   # rules.d/security.yaml
#   auth_failure:                          # ← Rule name
#     query: "_msg:authentication failed"
#     parser:
#       json:
#         fields:
#           - user
#           - ip
#     notify:
#       template: default_alert
#       destinations:
#         - slack-security
#
# Names must be unique across all files. Collisions produce explicit errors.
#
# ══════════════════════════════════════════════════════════════════════════════


# ┌────────────────────────────────────────────────────────────────────────────┐
# │ VICTORIALOGS SOURCES                                             [REQUIRED]│
# └────────────────────────────────────────────────────────────────────────────┘
# `victorialogs` is a map of named sources (breaking change in v2.0.0).
# Each rule can target a subset via `vl_sources: [name, ...]`, or omit the
# field to fan out across every configured source.
#
# See docs/configuration.md for the v1.x → v2.0 migration snippet.

victorialogs:
  default:
    url: "http://127.0.0.1:9428"

    # ── Authentication (optional, per source) ──────────────────────────────
    #
    # basic_auth:
    #   username: "${VL_USER}"
    #   password: "${VL_PASS}"
    #
    # headers:                             # For Bearer tokens or API keys
    #   Authorization: "Bearer ${VL_TOKEN}"

    # ── TLS (optional, per source) ─────────────────────────────────────────
    #
    # tls:
    #   verify: true                       # Set false for self-signed certs

  # ── Example: multi-source (production + dev) ───────────────────────────────
  #
  # vlprod:
  #   url: "https://victorialogs.prod.example.com:9428"
  #   basic_auth:
  #     username: "${VL_PROD_USER}"
  #     password: "${VL_PROD_PASS}"
  # vldev:
  #   url: "http://victorialogs.dev.internal:9428"


# ┌────────────────────────────────────────────────────────────────────────────┐
# │ DEFAULTS                                                         [REQUIRED]│
# └────────────────────────────────────────────────────────────────────────────┘

defaults:
  throttle:
    count: 5                               # Max alerts per window
    window: 60s                            # Duration: 30s, 5m, 1h, etc.

  timestamp_timezone: "UTC"       # IANA timezone for log_timestamp_formatted
                                           # Examples: UTC, America/New_York, Asia/Tokyo


# ┌────────────────────────────────────────────────────────────────────────────┐
# │ TEMPLATES                                                        [REQUIRED]│
# └────────────────────────────────────────────────────────────────────────────┘
# Message templates using Jinja2 syntax (minijinja).
#
# A template entry has two sides:
#
# 1. Template variables AVAILABLE on the right-hand side of each line below.
#    These come from the matched VictoriaLogs event and the runtime:
#      _msg, _time, _stream                   VL built-in event fields
#                                             (`_stream_id` is present only on
#                                              streams configured server-side)
#      <any parser-extracted field>           JSON field or named regex group
#      rule_name                              name of the triggered rule
#                                             (available in `title`, `body`,
#                                              `email_body_html`, `throttle.key`,
#                                              and in notifier-level
#                                              `subject_template` /
#                                              `body_template`)
#      log_timestamp                          event timestamp (ISO8601)
#                                             (notifier-level templates only)
#      log_timestamp_formatted                human timestamp (defaults.timestamp_timezone)
#                                             (notifier-level templates only)
#      log                                    every field of the event, in
#                                             notifier-level templates only:
#                                             {{ log.host }}, {{ log["k8s.pod"] }}
#                                             (in rule templates, fields are
#                                             top-level: {{ host }})
#
#    Escaping filters (any template): `| e` (HTML), `| md_escape` (Markdown
#    for Mattermost), `| mdv2_escape` (Telegram MarkdownV2).
#
# 2. Template OUTPUT KEYS that you define below (left-hand side). These are
#    the slots valerter fills and hands off to notifiers:
#      title         Alert title (required)
#      body          Alert body, plain text or Markdown (required)
#      email_body_html     HTML-enriched version used ONLY by the email notifier
#                    (Telegram, Mattermost, and webhook all read `body` and
#                    ignore `email_body_html`). Do not put HTML in `body` for
#                    Telegram: its default body_template escapes `body`, so the
#                    tags show literally. Write the markup in the Telegram
#                    `body_template` and escape each value there
#                    (`<code>{{ log.host|e }}</code>`), see the Telegram
#                    notifier below and docs/notifiers.md.
#      accent_color  Hex color for visual indicators (optional, e.g., "#ff0000")
#
# Note: `title` and `body` are NOT variables you can reference on the right.
# If you want the raw log line, use `{{ _msg }}`.

templates:
  default_alert:
    title: "{{ rule_name }}"
    # _msg is the raw log line from VictoriaLogs — works on any event without
    # needing a parser. Replace with a parsed field for richer templates.
    body: "{{ _msg }}"
    accent_color: "#3498db"

  # ── Example: Severity-based template ───────────────────────────────────────
  #
  # critical_alert:
  #   title: "🔴 CRITICAL: {{ rule_name }}"
  #   body: |
  #     **Host:** {{ host }}
  #     **Message:** {{ message | default(_msg) }}
  #   email_body_html: |
  #     <h2 style="color: red;">{{ rule_name }}</h2>
  #     <p><strong>Host:</strong> {{ host }}</p>
  #     <p>{{ message | default(_msg) }}</p>
  #   accent_color: "#e74c3c"

  # ── Example: Markdown body, rendered for each notifier ─────────────────────
  # body_format: markdown (default: text) makes `body` a Markdown source:
  # every {{ value }} is escaped, | tojson included (| safe, and only it,
  # inserts trusted Markdown), and the body is rendered per notifier
  # (Mattermost: Markdown, Telegram: HTML, email: HTML, so no email_body_html
  # is needed; webhook: plain text by default, see the `format` key of
  # notifiers). Raw HTML and tables are shown as text. `code`, `codeblock` and
  # `md_link` build Markdown from values and keep them literal wherever they
  # are written; never write {{ value }} inside backticks or a ``` fence (use
  # them instead). Encode values put in a URL with | urlencode.
  # See docs/configuration.md#markdown-bodies-body_format.
  #
  # markdown_alert:
  #   title: "{{ rule_name }} on {{ host }}"
  #   body_format: markdown
  #   body: |
  #     **{{ host }}** reported an error at {{ _time }}
  #     {{ md_link("Logs in VictoriaLogs", "https://vl.example.com/select/vmui?query=" ~ ("host:" ~ host) | urlencode) }}
  #     {{ _msg | codeblock }}


# ┌────────────────────────────────────────────────────────────────────────────┐
# │ NOTIFIERS                                                        [REQUIRED]│
# └────────────────────────────────────────────────────────────────────────────┘
# At least one notifier must be configured.
# Rules reference notifiers by name in their destinations list.

notifiers:

  # ── Mattermost ─────────────────────────────────────────────────────────────
  # Incoming webhook integration.
  #
  # Required: webhook_url
  # Optional: channel (override default), username, icon_url,
  #           format (body of a Markdown alert; only value: markdown)

  mattermost-ops:
    type: mattermost
    webhook_url: "https://mattermost.example.com/hooks/xxx"
    # channel: alerts
    # username: valerter
    # icon_url: "https://example.com/icon.png"

  # ── Webhook (Generic HTTP) ─────────────────────────────────────────────────
  # Send alerts to any HTTP endpoint (Slack, PagerDuty, custom APIs).
  #
  # Required: url
  # Optional: method (default: POST), headers, body_template,
  #           format (body of a Markdown alert: plain (default), markdown or
  #           html; markdown for Mattermost through a generic webhook or
  #           another CommonMark engine, html for Teams; Discord: plain)
  #
  # Default payload when body_template is omitted:
  # {
  #   "alert_name": "<notifier_name>",
  #   "rule_name": "...",
  #   "title": "...",
  #   "body": "...",
  #   "timestamp": "<ISO8601>",
  #   "log_timestamp": "<ISO8601>",
  #   "log_timestamp_formatted": "DD/MM/YYYY HH:MM:SS TZ"
  # }

  #
  # Requests carry "Content-Type: application/json" unless headers set one.
  # Values are inserted without escaping: in JSON bodies, use the tojson filter
  # WITHOUT surrounding quotes ({{ body | tojson }}, not "{{ body }}"), or a
  # quote or line break in a log line produces invalid JSON (logged as
  # "Webhook body is not valid JSON"; the request is still sent).
  # ${VAR} references in the body_template source are resolved at startup, like
  # url and headers (undefined variable = startup failure); values rendered from
  # logs are never resolved. Keep values containing {{, {% or " out of it.

  # slack-alerts:
  #   type: webhook
  #   url: "${SLACK_WEBHOOK_URL}"
  #   body_template: |
  #     {
  #       "text": {{ ("*" ~ title ~ "*\n" ~ body) | tojson }},
  #       "username": "Valerter"
  #     }

  # pagerduty:
  #   type: webhook
  #   url: "https://events.pagerduty.com/v2/enqueue"
  #   # Events API v2: the routing key in the body authenticates the event, no
  #   # Authorization header needed. Set PAGERDUTY_ROUTING_KEY in the daemon's
  #   # environment to your integration key.
  #   # custom_details lists event fields read from `log` (null when absent).
  #   body_template: |
  #     {
  #       "routing_key": "${PAGERDUTY_ROUTING_KEY}",
  #       "event_action": "trigger",
  #       "payload": {
  #         "summary": {{ title | tojson }},
  #         "source": {{ log.host | default("valerter") | tojson }},
  #         "severity": "error",
  #         "custom_details": {
  #           "rule": {{ rule_name | tojson }},
  #           "vl_source": {{ vl_source | tojson }},
  #           "log_time": {{ log._time | tojson }},
  #           "message": {{ log._msg | tojson }},
  #           "pod": {{ log["k8s.pod"] | tojson }}
  #         }
  #         {#- Or send every field of the event (dotted keys appear twice,
  #             flat and expanded, and secrets in the log line go along):
  #         "custom_details": {{ log | tojson }}
  #         #}
  #       }
  #     }

  # ── Email (SMTP) ───────────────────────────────────────────────────────────
  # Required: smtp.host, smtp.port, from, to, subject_template
  # Optional: smtp.username, smtp.password, smtp.tls, smtp.tls_verify,
  #           body_template (inline), body_template_file (path),
  #           format (body of a Markdown alert; only value: html)
  #
  # TLS modes:
  #   none     - No encryption (port 25, internal networks only)
  #   starttls - STARTTLS upgrade (port 587, recommended)
  #   tls      - Direct TLS (port 465)
  #
  # If no body template is specified, a default HTML template is used.

  # email-ops:
  #   type: email
  #   smtp:
  #     host: smtp.example.com
  #     port: 587
  #     username: "${SMTP_USER}"
  #     password: "${SMTP_PASSWORD}"
  #     tls: starttls                      # Default: starttls
  #     tls_verify: true                   # Default: true
  #   from: "valerter@example.com"
  #   to:
  #     - "ops@example.com"
  #     - "admin@example.com"
  #   subject_template: "[{{ rule_name | upper }}] {{ title }}"
  #   body_template: |                     # Optional: inline HTML body
  #     <h2>{{ title }}</h2>
  #     <p>{{ body }}</p>
  #   # body_template_file: /etc/valerter/email-template.html  # Or: external file

  # ── Telegram (Bot API) ─────────────────────────────────────────────────────
  # Send alerts to one or more Telegram chats via the Bot API.
  #
  # Required: bot_token, chat_ids (non-empty)
  # Optional: parse_mode (default: HTML), disable_notification,
  #           disable_web_page_preview, body_template,
  #           format (body of a Markdown alert: telegram_html, the default
  #           with parse_mode HTML, or plain, the default otherwise)
  #
  # The endpoint URL is built internally and never logged (contains the token).
  # Each chat_id triggers one sequential HTTP call; a 429 response honors
  # Telegram's Retry-After header before retrying.
  # Message text is truncated at 4096 Unicode codepoints (Telegram hard limit)
  # and the event is counted in valerter_alerts_truncated_total.

  # telegram-alerts:
  #   type: telegram
  #   bot_token: "${TELEGRAM_BOT_TOKEN}"
  #   chat_ids:
  #     - "-100123456789"
  #     - "-100987654321"
  #   parse_mode: HTML                       # Default: HTML (also: MarkdownV2)
  #   disable_notification: false            # Default: not set (Telegram default = false)
  #   disable_web_page_preview: true         # Default: not set
  #   # Optional; default: "<b>{{ title|e }}</b>\n{{ body|e }}". Write the
  #   # markup here and escape every inserted value with |e: `body` and the
  #   # event fields (`log`) may contain <, > or &.
  #   body_template: |
  #     <b>{{ title|e }}</b>
  #     Host: <code>{{ log.host|e }}</code>
  #     {{ body|e }}


# ┌────────────────────────────────────────────────────────────────────────────┐
# │ RULES                                                            [REQUIRED]│
# └────────────────────────────────────────────────────────────────────────────┘
# At least one rule must be configured.
#
# Fields:
#   name         - Unique identifier (required)
#   query        - LogsQL query (required)
#   parser       - Data extraction config (required, see below)
#   notify       - Notification settings (required)
#   enabled      - Enable/disable rule (optional, default: true)
#   throttle     - Override default throttle (optional)
#   vl_sources   - List of VL source names to target (optional; default: all)
#
# Parser (at least one of regex or json should be configured):
#   json.fields  - List of JSON fields to extract
#   regex        - Pattern with named capture groups: (?P<name>pattern)

rules:
  # ── Example 1: JSON logs with per-host throttling ──────────────────────────

  - name: high_cpu_alert
    # enabled: false                       # Optional: disable rule (default: true)
    query: '_stream:{host="server1"} AND _msg:"cpu" | json | cpu:>90'
    parser:
      json:
        fields:
          - host
          - cpu
          - timestamp
    throttle:
      key: "{{ host }}"                    # Throttle independently per host
      count: 3
      window: 5m
    # vl_sources: [default]                # Optional: restrict to specific sources
    notify:
      template: default_alert
      destinations:
        - mattermost-ops

  # ── Example 2: Regex parser ────────────────────────────────────────────────

  - name: error_log_alert
    query: '_stream:{app="myapp"} AND level:error'
    parser:
      regex: '(?P<timestamp>\S+) (?P<level>\S+) (?P<message>.*)'
    notify:
      template: default_alert
      # mattermost_channel: custom-channel # Mattermost channel for this rule, over the
      #                                    # notifier's channel; if Mattermost rejects it,
      #                                    # resent to the notifier's channel (or the
      #                                    # webhook default when it has none)
      destinations:
        - mattermost-ops

  # ── Example 3: Multi-destination routing ───────────────────────────────────
  #
  # - name: critical_alert
  #   query: '_stream:{app="myapp"} AND level:critical'
  #   parser:
  #     json:
  #       fields:
  #         - message
  #         - stack_trace
  #   notify:
  #     template: critical_alert
  #     destinations:
  #       - mattermost-ops
  #       - email-ops
  #       - pagerduty


# ┌────────────────────────────────────────────────────────────────────────────┐
# │ METRICS                                                          [OPTIONAL]│
# └────────────────────────────────────────────────────────────────────────────┘
# Prometheus metrics exposition at /metrics endpoint.

metrics:
  enabled: true                            # Default: true
  port: 9090                               # Default: 9090


# ══════════════════════════════════════════════════════════════════════════════
# ENVIRONMENT VARIABLES
# ══════════════════════════════════════════════════════════════════════════════
#
# Use ${VAR_NAME} syntax to reference environment variables in these fields
# (elsewhere, ${...} is kept as is):
#   - victorialogs.<source>: url, basic_auth.username, basic_auth.password,
#     headers values
#   - notifier secrets: Mattermost webhook_url; webhook url and headers values;
#     email smtp.username and smtp.password; Telegram bot_token
#   - webhook body_template source (write {{ '$' }}{VAR} for a literal ${VAR})
# Any variable from the process environment can be used (no predefined list).
# Substitution is a single pass: a value containing ${...} is not resolved again.
#
# Examples used in this file:
#   ${VL_USER}, ${VL_PASS}     - VictoriaLogs credentials
#   ${VL_TOKEN}                - Bearer token for VictoriaLogs
#   ${SMTP_USER}, ${SMTP_PASSWORD} - Email credentials
#   ${SLACK_WEBHOOK_URL}       - Slack webhook
#
# Runtime variables (not substituted in config, read directly by the process):
#   RUST_LOG   - Log level: error, warn, info (default), debug, trace
#   LOG_FORMAT - Output format: text (default), json
#
# ══════════════════════════════════════════════════════════════════════════════
