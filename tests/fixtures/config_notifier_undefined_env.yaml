# Fixture: a notifier references an environment variable that is never defined.
# Passes Config::validate(); rejected by the preflight (Notifier configuration error).
victorialogs:
  default:
    url: "http://vl.invalid:9428"

defaults:
  throttle:
    count: 5
    window: 60s

templates:
  alert:
    title: "Alert: {{ _msg }}"
    body: "Message: {{ _msg }}"

notifiers:
  mattermost-ops:
    type: mattermost
    webhook_url: "${VALERTER_TEST_UNSET_VAR}"

rules:
  - name: "r"
    enabled: true
    query: '_stream:{app="myapp"}'
    parser:
      json:
        fields: ["message"]
    notify:
      template: "alert"
      destinations:
        - "mattermost-ops"
