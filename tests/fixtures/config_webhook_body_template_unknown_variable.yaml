# Fixture: a webhook body_template reads `host`, a log field, without `log.`.
# Valid configuration: --validate succeeds and warns about the unknown variable.
victorialogs:
  default:
    url: "http://vl.invalid:9428"

defaults:
  throttle:
    count: 5
    window: 60s

templates:
  alert:
    title: "Alert: {{ _msg }}"
    body: "Message: {{ _msg }}"

notifiers:
  hook:
    type: webhook
    url: "https://hooks.example.com/alerts"
    body_template: '{"host": {{ host | tojson }}, "pod": {{ log.pod | tojson }}}'

rules:
  - name: "r"
    enabled: true
    query: '_stream:{app="myapp"}'
    parser:
      json:
        fields: ["message"]
    notify:
      template: "alert"
      destinations:
        - "hook"
