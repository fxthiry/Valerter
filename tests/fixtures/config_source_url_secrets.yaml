# Fixture: a VictoriaLogs source URL embedding credentials and a token.
# The --validate summary must redact them. Every host is unresolvable (*.invalid):
# --validate must succeed without any network call.
victorialogs:
  prod:
    url: "http://${VL_USER}:${VL_PASS}@vl.invalid:9428?token=${VL_TOKEN}"
  default:
    url: "http://localhost:9428"

defaults:
  throttle:
    count: 5
    window: 60s

templates:
  alert:
    title: "Alert: {{ _msg }}"
    body: "Message: {{ _msg }}"
    email_body_html: "<p>{{ _msg }}</p>"

notifiers:
  mattermost-ops:
    type: mattermost
    webhook_url: "https://mattermost.invalid/hooks/test"
  email-ops:
    type: email
    smtp:
      host: "smtp.invalid"
      port: 587
      tls: starttls
    from: "alerts@example.com"
    to:
      - "team@example.com"
    subject_template: "[Alert] {{ title }}"

rules:
  - name: "r"
    enabled: true
    query: '_stream:{app="myapp"}'
    parser:
      json:
        fields: ["message"]
    notify:
      template: "alert"
      destinations:
        - "mattermost-ops"
        - "email-ops"
